<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedLink – Internal Medicine Question Bank Explorer</title>
<style>
:root{--bg:#f3f6f9;--panel:#fff;--ink:#1b2a36;--muted:#5b6e7d;--line:#d9e2ea;--brand:#0b6e8a;--brand2:#0a4f66;
--common:#2563eb;--common-bg:#eaf1ff;--sym:#0f766e;--sym-bg:#e6f6f3;--shared:#7c3aed;--shared-bg:#f2ebff;
--opt:#475569;--opt-bg:#eef2f6;--cond:#b45309;--cond-bg:#fff4dc;--emg:#c62828;--emg-bg:#fdeaea;--end:#15803d;--end-bg:#e5f6ea;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
header.top{background:linear-gradient(90deg,var(--brand2),var(--brand));color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header.top h1{font-size:17px;margin:0;font-weight:600}
header.top h1 small{display:block;font-weight:400;opacity:.85;font-size:11px}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input{width:100%;padding:8px 12px;border-radius:8px;border:0;font:inherit}
#results{position:absolute;top:38px;left:0;right:0;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:420px;overflow:auto;display:none;z-index:60}
#results .it{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#results .it:hover{background:#f1f7fa}
#results .it small{color:var(--muted)}
.langsw{display:flex;gap:2px;margin-left:auto}
.langsw button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:5px 10px}
.langsw button:first-child{border-radius:6px 0 0 6px}.langsw button:last-child{border-radius:0 6px 6px 0}
.langsw button.on{background:#fff;color:var(--brand2)}
.banner{background:#fff3cd;border-bottom:1px solid #f0d98a;color:#5f4400;padding:8px 16px;font-size:12.5px}
.banner b{color:#8a1c1c}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 400px;gap:0;align-items:start}
nav#side{position:sticky;top:96px;max-height:calc(100vh - 100px);overflow:auto;padding:12px;border-right:1px solid var(--line);background:var(--panel)}
nav#side a{display:flex;justify-content:space-between;gap:6px;padding:6px 9px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13px}
nav#side a:hover{background:#eef4f8}
nav#side a.on{background:var(--brand);color:#fff}
nav#side h4{margin:12px 6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
nav#side .n{opacity:.7;font-size:11px}
main#main{padding:16px 18px;min-width:0}
aside#panel{position:sticky;top:96px;max-height:calc(100vh - 100px);overflow:auto;border-left:1px solid var(--line);background:var(--panel)}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);z-index:5;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
#pdetail,#psim{padding:12px 14px}
.ar{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif}
.bi .en,.bi .ar{display:block}
.bi .ar{direction:rtl;text-align:right;color:#27475a}
body.lang-en .ar{display:none!important}
body.lang-ar .en{display:none!important}
body.lang-both .chip .en+.ar::before{content:" · "}
.chip .en,.chip .ar{display:inline}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 8px}
.hero h2{font-size:20px}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:#f6fafc;border:1px solid var(--line);border-radius:9px;padding:10px}
.stat b{font-size:22px;display:block;color:var(--brand2)}
.stat span{font-size:12px;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow .st{background:var(--common-bg);border:1px solid #c8d8fb;border-radius:8px;padding:5px 9px;font-size:12px}
.flow .st.s{background:var(--sym-bg);border-color:#b8e2dc}
.flow .st.e{background:var(--emg-bg);border-color:#f2b9b9}
.flow .st.d{background:var(--end-bg);border-color:#b8e3c4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.symcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--sym);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.symcard.common{border-top-color:var(--common)}
.symcard.emg{border-top-color:var(--emg)}
.symcard .t{font-weight:600;font-size:15px}
.symcard .meta{font-size:12px;color:var(--muted)}
.symcard .acts{display:flex;gap:8px;align-items:center;margin-top:auto}
.btn{background:var(--brand);color:#fff;border:0;border-radius:7px;padding:6px 11px}
.btn.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.red{background:var(--emg)}
.btn.sm{padding:3px 8px;font-size:12px}
.selbar{position:sticky;top:96px;z-index:20;background:#fff;border:1px solid var(--brand);border-radius:9px;padding:8px 12px;margin-bottom:12px;display:none;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--opt-bg);color:var(--opt);margin:1px 2px}
.chip.opt{background:var(--opt-bg)}
.chip.sym{background:var(--sym-bg);color:var(--sym);border-color:#b8e2dc}
.chip.warn{background:#fff0d6;color:#8a5200;border-color:#f1d29a}
.chip.spec{background:#eef;color:#334}
.badge{display:inline-block;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;margin-right:3px;border:1px solid transparent}
.badge.type{background:#e8eef3;color:#37505f}
.badge.common{background:var(--common-bg);color:var(--common)}
.badge.symptom{background:var(--sym-bg);color:var(--sym)}
.badge.shared{background:var(--shared-bg);color:var(--shared)}
.badge.req{background:#f4f4f4;color:#555}
.badge.rev{background:#fff0d6;color:#8a5200}
.badge.ok{background:var(--end-bg);color:var(--end)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.toolbar label{font-size:12.5px;display:flex;align-items:center;gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.tree .node{margin:0}
.qcard{border:1px solid var(--line);border-left:6px solid var(--sym);background:#fff;border-radius:var(--r);padding:8px 10px;cursor:pointer;max-width:760px}
.qcard:hover{box-shadow:0 2px 10px rgba(11,110,138,.18)}
.qcard.common{border-left-color:var(--common);background:var(--common-bg)}
.qcard.symptom{border-left-color:var(--sym);background:var(--sym-bg)}
.qcard.shared{border-left-color:var(--shared);background:var(--shared-bg)}
body.hl-shared .qcard.shared{box-shadow:0 0 0 3px #c4b5fd}
.qcard.on-path{outline:3px solid #f59e0b}
.qcard.current{outline:3px solid #dc2626;animation:pulse 1.4s infinite}
.qcard.flash{animation:flash 1.6s}
@keyframes pulse{50%{outline-color:#fca5a5}}
@keyframes flash{0%,60%{box-shadow:0 0 0 6px #fde68a}}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-bottom:3px}
.qid{font-family:Consolas,Menlo,monospace;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:12px}
.tog{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 7px;line-height:20px}
.node.collapsed>.qcard .tog{transform:rotate(-90deg)}
.qtext{font-size:14px}
.opts{margin-top:5px;display:flex;flex-wrap:wrap}
body.no-opts .opts{display:none}
.branches{margin:6px 0 4px 22px;border-left:2px solid var(--line);padding-left:12px}
.node.collapsed>.branches{display:none}
.branch{margin:9px 0}
.bline{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.prio{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 5px;cursor:pointer;color:var(--muted)}
.condbox{background:var(--cond-bg);border:1px solid #f1d8a1;color:#5e3706;padding:3px 8px;border-radius:8px;font-size:12px;max-width:640px}
.branch.default>.bline .condbox{background:#f1f5f9;border-color:var(--line);color:var(--muted)}
.branch.fired>.bline .condbox{outline:2px solid #f59e0b}
.arrow{color:var(--muted)}
.kw{color:var(--cond);font-weight:600}
.op{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;color:#fff;background:#92400e}
.op.OR{background:#0e7490}.op.NOT{background:#9f1239}
.qref,.ref{cursor:pointer;color:var(--brand);font-family:Consolas,Menlo,monospace;font-size:12px;font-weight:700;text-decoration:underline dotted}
.child{margin:6px 0 0 6px}
.endnode{display:inline-block;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;background:var(--end-bg);color:var(--end);border:1px solid #a6d9b5}
.endnode.start{background:var(--common-bg);color:var(--common);border-color:#bcd0fb}
.endnode.stop{background:#eee;color:#444;border-color:#ccc}
.emgbox{border:1px solid #efb3b3;border-left:6px solid var(--emg);background:var(--emg-bg);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.emgbox h3{margin:0 0 4px;color:var(--emg);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:#f3f7fa;position:sticky;top:0}
td.num,th.num{text-align:right}
.dl{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
.dl dt{color:var(--muted)}.dl dd{margin:0}
pre{background:#0f1b24;color:#d6e4ee;padding:8px;border-radius:7px;overflow:auto;font-size:11.5px;max-height:240px;direction:ltr;text-align:left}
.simq{background:#f7fbfd;border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0}
.simopt{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:6px;cursor:pointer}
.simopt:hover{background:#e9f3f8}
.path ol{padding-left:20px;margin:6px 0}
.path li{margin:4px 0;font-size:12.5px}
.alert{background:var(--emg-bg);border:1px solid #efb3b3;border-left:6px solid var(--emg);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:12.5px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2d38;color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:99}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:1180px){.layout{grid-template-columns:200px minmax(0,1fr)}aside#panel{grid-column:1/-1;position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:760px){.layout{grid-template-columns:1fr}nav#side{position:static;max-height:none;border-right:0}}
</style>
</head>

NG_PHYSICIAN_REVIEW"},{"id":"BR_0201","sourceQuestionId":"AP_01","priority":10,"condition":{"op":"ANSWER_EQUALS","questionId":"AP_01","optionId":"AP_01_SEVERE"},"target":{"type":"QUESTION","questionId":"AP_06"},"note":"Severe: check fluid intake first","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0202","sourceQuestionId":"AP_01","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"AP_02"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0203","sourceQuestionId":"AP_02","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"AP_03"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0204","sourceQuestionId":"AP_03","priority":10,"condition":{"op":"ANSWER_ANY_OF","questionId":"AP_03","optionIds":["AP_03_SWALLOW"]},"target":{"type":"QUESTION","questionId":"AP_07"},"note":"Swallowing difficulty details","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0205","sourceQuestionId":"AP_03","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"AP_04"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0206","sourceQuestionId":"AP_04","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"AP_05"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0207","sourceQuestionId":"AP_05","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"END_SYMPTOM_PATH"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0208","sourceQuestionId":"AP_06","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"AP_02"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0209","sourceQuestionId":"AP_07","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"AP_04"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0210","sourceQuestionId":"SY_01","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"SY_02"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0211","sourceQuestionId":"SY_02","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"SY_03"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0212","sourceQuestionId":"SY_03","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"SY_04"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0213","sourceQuestionId":"SY_04","priority":10,"condition":{"op":"ANSWER_ANY_OF","questionId":"SY_04","optionIds":["SY_04_JERKING"]},"target":{"type":"QUESTION","questionId":"SY_08"},"note":"Seizure-type features: ask about epilepsy history","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0214","sourceQuestionId":"SY_04","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"SY_05"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0215","sourceQuestionId":"SY_05","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"SY_06"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0216","sourceQuestionId":"SY_06","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"SY_07"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_RE ult path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0225","sourceQuestionId":"JD_06","priority":10,"condition":{"op":"ANSWER_ANY_OF","questionId":"JD_06","optionIds":["JD_06_CONFUSION"]},"target":{"type":"QUESTION","questionId":"JD_07"},"note":"Confusion: ask if present now","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0226","sourceQuestionId":"JD_06","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"SH_03"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"},{"id":"BR_0227","sourceQuestionId":"JD_07","priority":1000,"condition":{"op":"ALWAYS"},"target":{"type":"QUESTION","questionId":"SH_03"},"note":"Default path","requiresPhysicianApproval":true,"reviewStatus":"PENDING_PHYSICIAN_REVIEW"}]}</script>
<script>
(function(){
'use strict';
var DATA=JSON.parse(document.getElementById('qb-data').textContent);
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function bi(en,ar){return '<span class="bi"><span class="en">'+esc(en)+'</span><span class="ar" dir="rtl" lang="ar">'+esc(ar)+'</span></span>';}
function chipBi(en,ar,cls){return '<span class="chip '+(cls||'')+'"><span class="en">'+esc(en)+'</span><span class="ar" dir="rtl" lang="ar">'+esc(ar)+'</span></span>';}

var Q={},O={},S={},B={};
DATA.questions.forEach(function(q){Q[q.id]=q;});
DATA.answerOptions.forEach(function(o){O[o.id]=o;});
DATA.symptoms.forEach(function(s){S[s.id]=s;});
DATA.bodySystems.forEach(function(b){B[b.id]=b;});
var RULES=DATA.branchingRules, EM=DATA.medicalSafety.emergencyRules.rules, ENG=DATA.engine;
var OUT={},IN={},OPTS={},EMBYQ={};
RULES.forEach(function(r){(OUT[r.sourceQuestionId]=OUT[r.sourceQuestionId]||[]).push(r);
  if(r.target.type==='QUESTION'){(IN[r.target.questionId]=IN[r.target.questionId]||[]).push(r);}});
Object.keys(OUT).forEach(function(k){OUT[k].sort(function(a,b){return a.priority-b.priority;});});
DATA.answerOptions.forEach(function(o){(OPTS[o.questionId]=OPTS[o.questionId]||[]).push(o);});
Object.keys(OPTS).forEach(function(k){OPTS[k].sort(function(a,b){return a.order-b.order;});});
function condQuestions(c,acc){acc=acc||[];if(c.questionId)acc.push(c.questionId);(c.conditions||[]).forEach(function(x){condQuestions(x,acc);});if(c.condition)condQuestions(c.condition,acc);return acc;}
EM.forEach(function(e){condQuestions(e.condition).forEach(function(q){(EMBYQ[q]=EMBYQ[q]||[]);if(EMBYQ[q].indexOf(e)<0)EMBYQ[q].push(e);});});

/* ---------- condition rendering ---------- */
var OPSYM={LT:'<',LTE:'≤',GT:'>',GTE:'≥',EQ:'='};
function qref(id){return '<a class="qref" data-q="'+esc(id)+'">'+esc(id)+'</a>';}
function optChip(id){var o=O[id];return o?chipBi(o.textEn,o.textAr,'opt'):esc(id);}
function condHtml(c,top){
  switch(c.op){
    case 'ALWAYS':return '<span class="kw">otherwise (default)</span>';
    case 'ANSWER_EQUALS':return qref(c.questionId)+' <span class="kw">is</span> '+optChip(c.optionId);
    case 'ANSWER_ANY_OF':return qref(c.questionId)+' <span class="kw">includes ANY of</span> '+c.optionIds.map(optChip).join(' ');
    case 'ANSWER_ALL_OF':return qref(c.questionId)+' <span class="kw">includes ALL of</span> '+c.optionIds.map(optChip).join(' ');
    case 'NUMBER_COMPARE':return qref(c.questionId)+' <span class="kw">'+OPSYM[c.operator]+'</span> <b>'+c.value+'</b>'+(c.parameterStatus?' <span class="chip warn" title="'+esc(c.parameterStatus)+'">placeholder</span>':'');
    case 'DURATION_COMPARE':return qref(c.questionId)+' duration <span class="kw">'+OPSYM[c.operator]+'</span> <b>'+c.valueDays+' days</b> <span class="chip warn" title="'+esc(c.parameterStatus)+'">placeholder</span>';
    case 'SCALE_COMPARE':return qref(c.questionId)+' <span class="kw">'+OPSYM[c.operator]+'</span> <b>'+c.value+'</b>';
    case 'ACTIVE_SYMPTOM_IS':return '<span class="kw">active symptom is</span> '+chipBi(S[c.symptomId].textEn,S[c.symptomId].textAr,'sym');
    case 'SYMPTOM_SELECTED':return '<span class="kw">symptom selected:</span> '+chipBi(S[c.symptomId].textEn,S[c.symptomId].textAr,'sym');
    case 'AND':case 'OR':{
      var j=c.conditions.map(function(x){return condHtml(x,false);}).join(' <span class="op '+c.op+'">'+c.op+'</span> ');
      return top?j:'('+j+')';}
    case 'NOT':return '<span class="op NOT">NOT</span> ('+condHtml(c.condition,false)+')';
  }
  return esc(JSON.stringify(c));
}
function targetText(t){
  if(!t)return '—';
  if(t.type==='QUESTION')return t.questionId;
  if(t.type==='START_SYMPTOM_PATHS')return 'Start symptom paths';
  if(t.type==='END_SYMPTOM_PATH')return 'End of symptom path';
  return 'End questionnaire ('+(t.reason||'')+')';
}
function opsIn(c,acc){acc=acc||{};acc[c.op]=1;(c.conditions||[]).forEach(function(x){opsIn(x,acc);});if(c.condition)opsIn(c.condition,acc);return acc;}

/* ---------- engine ---------- */
var DAYS=ENG.durationToDays;
function cmp(a,op,b){switch(op){case 'LT':return a<b;case 'LTE':return a<=b;case 'GT':return a>b;case 'GTE':return a>=b;case 'EQ':return a===b;}return false;}
function evalCond(c,st){
  var a;
  switch(c.op){
    case 'ALWAYS':return true;
    case 'ANSWER_EQUALS':a=st.answers[c.questionId];return !!(a&&a.options&&a.options.indexOf(c.optionId)>=0);
    case 'ANSWER_ANY_OF':a=st.answers[c.questionId];return !!(a&&a.options&&c.optionIds.some(function(o){return a.options.indexOf(o)>=0;}));
    case 'ANSWER_ALL_OF':a=st.answers[c.questionId];return !!(a&&a.options&&c.optionIds.every(function(o){return a.options.indexOf(o)>=0;}));
    case 'NUMBER_COMPARE':case 'SCALE_COMPARE':a=st.answers[c.questionId];return !!(a&&typeof a.value==='number'&&cmp(a.value,c.operator,c.value));
    case 'DURATION_COMPARE':a=st.answers[c.questionId];return !!(a&&typeof a.value==='number'&&cmp(a.value*DAYS[a.unit],c.operator,c.valueDays));
    case 'ACTIVE_SYMPTOM_IS':return st.activeSymptom===c.symptomId;
    case 'SYMPTOM_SELECTED':return st.selected.indexOf(c.symptomId)>=0;
    case 'AND':return c.conditions.every(function(x){return evalCond(x,st);});
    case 'OR':return c.conditions.some(function(x){return evalCond(x,st);});
    case 'NOT':return !evalCond(c.condition,st);
  }
  return false;
}
function resolveNext(qid,st){var rs=OUT[qid]||[];for(var i=0;i<rs.length;i++){if(evalCond(rs[i].condition,st))return rs[i];}return null;}
function ctxSyms(c){if(c.op==='ACTIVE_SYMPTOM_IS')return [c.symptomId];if(c.op==='AND'){for(var i=0;i<c.conditions.length;i++){var r=ctxSyms(c.conditions[i]);if(r)return r;}}return null;}
function ruleApplies(r,sym){var c=ctxSyms(r.condition);return !c||c.indexOf(sym)>=0;}

/* ---------- statistics ---------- */
function nextEdges(qid,sym){var out=[],seen={};(OUT[qid]||[]).forEach(function(r){if(sym&&!ruleApplies(r,sym))return;var t=r.target,k=t.type==='QUESTION'?t.questionId:t.type;if(!seen[k]){seen[k]=1;out.push(k);}});return out;}
function pathStats(root,sym){var memo={};function f(n){if(!Q[n])return {paths:1,depth:0};if(memo[n])return memo[n];var p=0,d=0;nextEdges(n,sym).forEach(function(t){var r=f(t);p+=r.paths;d=Math.max(d,r.depth);});var res={paths:p||1,depth:d+1};memo[n]=res;return res;}return f(root);}
function reachSet(root,sym){var seen={},st=[root];while(st.length){var n=st.pop();if(seen[n]||!Q[n])continue;seen[n]=1;nextEdges(n,sym).forEach(function(t){st.push(t);});}return Object.keys(seen);}
function symStats(s){
  var nodes=reachSet(s.entryQuestionId,s.id);
  var rules=0,opts=0;
  nodes.forEach(function(q){(OUT[q]||[]).forEach(function(r){if(ruleApplies(r,s.id))rules++;});opts+=(OPTS[q]||[]).length;});
  var ps=pathStats(s.entryQuestionId,s.id);
  var em=EM.filter(function(e){return e.symptomId===s.id;}).length;
  return {own:s.symptomQuestionIds.length,shared:s.sharedQuestionIds.length,nodes:nodes.length,rules:rules,opts:opts,paths:ps.paths,depth:ps.depth,em:em};
}
var SS={};DATA.symptoms.forEach(function(s){SS[s.id]=symStats(s);});
var GS=(function(){
  var g={q:DATA.questions.length,common:0,sym:0,shared:0,opts:DATA.answerOptions.length,rules:RULES.length,em:EM.length,types:{},req:0,opt:0,
    single:0,multi:0,composite:0,numeric:0,ctx:0,deflt:0,diverge:0,ends:0,cross:0};
  DATA.questions.forEach(function(q){if(q.scope==='COMMON')g.common++;else if(q.scope==='SYMPTOM')g.sym++;else g.shared++;g.types[q.type]=(g.types[q.type]||0)+1;if(q.required)g.req++;else g.opt++;});
  var defT={};RULES.forEach(function(r){if(r.condition.op==='ALWAYS')defT[r.sourceQuestionId]=JSON.stringify(r.target);});
  RULES.forEach(function(r){var o=opsIn(r.condition);
    if(o.ALWAYS)g.deflt++;
    if(o.ANSWER_EQUALS)g.single++;
    if(o.ANSWER_ANY_OF||o.ANSWER_ALL_OF)g.multi++;
    if(o.AND||o.OR||o.NOT)g.composite++;
    if(o.NUMBER_COMPARE||o.DURATION_COMPARE||o.SCALE_COMPARE)g.numeric++;
    if(o.ACTIVE_SYMPTOM_IS)g.ctx++;
    if(r.target.type!=='QUESTION')g.ends++;
    if(!o.ALWAYS&&!o.ACTIVE_SYMPTOM_IS&&defT[r.sourceQuestionId]&&defT[r.sourceQuestionId]!==JSON.stringify(r.target))g.diverge++;
    var qs=condQuestions(r.condition);if(qs.some(function(q){return q!==r.sourceQuestionId;}))g.cross++;});
  g.pending=DATA.questions.length+RULES.length+EM.length+DATA.symptoms.length;
  return g;
})();

/* ---------- state ---------- */
var view={type:'home'},sel={},panelTab='detail',pendingFocus=null,lastDetail=null;
var main=$('#main'),side=$('#side'),pdetail=$('#pdetail'),psim=$('#psim');
$('#banner').innerHTML='<b>⚠ '+esc(DATA.medicalSafety.urgentWarning.en)+'</b> <span class="ar" dir="rtl" lang="ar" style="display:block">'+esc(DATA.medicalSafety.urgentWarning.ar)+'</span><div style="margin-top:4px"><i>'+esc(DATA.medicalSafety.notDiagnosticDisclaimer.en)+' '+esc(DATA.meta.notice)+'</i></div>';
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none';},2800);}
function selList(){return DATA.symptoms.filter(function(s){return sel[s.id];}).map(function(s){return s.id;});}

/* ---------- routing ---------- */
function go(hash,focus){pendingFocus=focus||null;if(location.hash===hash)route();else location.hash=hash;}
function route(){
  var h=location.hash.replace(/^#\/?/,'').split('/');
  var t=h[0]||'home';
  if(t==='symptom'&&S[h[1]])view={type:'symptom',id:h[1]};
  else if(t==='common')view={type:'common'};
  else if(t==='emergency')view={type:'emergency'};
  else if(t==='stats')view={type:'stats'};
  else view={type:'home'};
  renderSide();renderMain();
  window.scrollTo(0,0);
  if(pendingFocus){var f=pendingFocus;pendingFocus=null;focusNode(f);}
  highlightSim();
}
window.addEventListener('hashchange',function(){pendingFocus=pendingFocus||null;route();});

function renderSide(){
  var h='<h4>Dashboard</h4>';
  function a(href,label,n,on){return '<a href="'+href+'" class="'+(on?'on':'')+'"><span>'+label+'</span>'+(n!=null?'<span class="n">'+n+'</span>':'')+'</a>';}

/* ---------- tree ---------- */
function qclass(q){return q.scope==='COMMON'?'common':q.scope==='SHARED'?'shared':'symptom';}
function specHtml(q){
  var s=q.inputSpec;if(!s)return '';
  if(q.type==='NUMBER')return '<span class="chip spec">number'+(s.unit?' · '+esc(s.unit):'')+' · range '+s.min+'–'+s.max+' (input bounds)</span>';
  if(q.type==='DURATION')return '<span class="chip spec">duration · units: '+s.units.join(', ')+'</span>';
  if(q.type==='SCALE')return '<span class="chip spec">scale '+s.min+'–'+s.max+'</span>';
  return '';
}
function cardHtml(q){
  var h='<div class="qhead"><span class="qid">'+esc(q.id)+'</span><span class="badge type">'+q.type+'</span><span class="badge '+qclass(q)+'">'+(q.scope==='SHARED'?'SHARED ×'+q.relatedSymptomIds.length:q.scope)+'</span><span class="badge req">'+(q.required?'required':'optional')+'</span><span class="badge rev" title="'+esc(q.reviewStatus)+'">needs physician review</span><button class="tog" title="Expand / collapse branches">▾</button></div>';
  h+='<div class="qtext">'+bi(q.textEn,q.textAr)+'</div>';
  var os=OPTS[q.id]||[];
  h+='<div class="opts">'+(os.length?os.map(function(o){return '<span class="chip opt" title="'+esc(o.id)+'"><span class="en">'+esc(o.textEn)+'</span><span class="ar" dir="rtl" lang="ar">'+esc(o.textAr)+'</span></span>';}).join(''):specHtml(q))+'</div>';
  return h;
}
function renderTreeView(o){
  var h='<section class="card"><div class="sec-h"><h2>'+o.title+'</h2><div>';
  if(o.kind==='symptom'){h+='<button class="btn sm" data-act="simview">▶ Simulate this symptom</button> ';}
  else {h+='<button class="btn sm" data-act="simview">▶ Simulate (common questions)</button> ';}
  h+='</div></div>';
  if(o.kind==='symptom'){var s=o.s,st=SS[s.id];
    h+='<p class="muted">'+esc(B[s.bodySystemId].textEn)+' · entry question '+qref(s.entryQuestionId)+' · '+st.nodes+' questions ('+st.own+' symptom-specific + '+st.shared+' shared) · '+st.rules+' rules · '+st.paths+' distinct paths · longest path '+st.depth+' questions · '+st.em+' symptom-specific emergency rules</p>';}
  else h+='<p class="muted">'+esc(o.desc)+' Entry question '+qref(o.root)+'. After the last question the engine starts the selected symptom paths.</p>';
  h+='<div class="toolbar"><button class="btn sm alt" data-act="expand">Expand all</button><button class="btn sm alt" data-act="collapse">Collapse all</button><button class="btn sm alt" data-act="level1">Collapse to first level</button>'+
     '<label><input type="checkbox" id="chk-shared" '+(document.body.classList.contains('hl-shared')?'checked':'')+'> highlight shared questions</label>'+
     '<label><input type="checkbox" id="chk-opts" '+(document.body.classList.contains('no-opts')?'':'checked')+'> show answer options</label></div>';

  var sec=el('section','card tree');sec.id='tree';
  main.innerHTML=h;
  var seen={};
  function node(qid){
    seen[qid]=1;var q=Q[qid];
    var n=el('div','node');n.dataset.q=qid;
    var card=el('div','qcard '+qclass(q),cardHtml(q));card.dataset.q=qid;n.appendChild(card);
    var br=el('div','branches');
    (OUT[qid]||[]).forEach(function(r){
      if(o.sym&&!ruleApplies(r,o.sym))return;
      var row=el('div','branch '+(r.condition.op==='ALWAYS'?'default':'cond'));row.dataset.rule=r.id;
      var t=r.target,tg;
      if(t.type==='QUESTION'){tg=seen[t.questionId]?'<a class="ref" data-q="'+t.questionId+'">↪ '+t.questionId+' (shown above)</a>':'<span class="qid">'+t.questionId+'</span>';}
      else if(t.type==='START_SYMPTOM_PATHS')tg='<span class="endnode start">▶ Start symptom-specific paths</span>';
      else if(t.type==='END_SYMPTOM_PATH')tg='<span class="endnode">■ End of symptom path</span>';
      else tg='<span class="endnode stop">■ End of questionnaire · '+esc(t.reason||'')+'</span>';
      row.innerHTML='<div class="bline"><span class="prio" data-rule="'+r.id+'" title="Rule '+r.id+' · click for details">P'+r.priority+'</span><span class="condbox">'+condHtml(r.condition,true)+'</span><span class="arrow">➜</span>'+tg+'</div>';
      if(t.type==='QUESTION'&&!seen[t.questionId]){var ch=el('div','child');ch.appendChild(node(t.questionId));row.appendChild(ch);}
      br.appendChild(row);
    });
    n.appendChild(br);return n;
  }
  sec.appendChild(node(o.root));
  main.appendChild(sec);
}

/* ---------- simulator ---------- */
var sim={active:false,done:false,queue:[],qi:-1,ctx:null,answers:{},cur:null,path:[],alerts:[],hist:[],endReason:null,skipCommon:false};
function stt(){return {answers:sim.answers,activeSymptom:sim.ctx,selected:sim.queue};}
function answerText(q,a){
  if(!a)return '(skipped)';
  if(a.options)return a.options.map(function(i){return O[i].textEn;}).join(', ');
  if(q.type==='DURATION')return a.value+' '+a.unit.toLowerCase();
  return String(a.value)+(q.inputSpec&&q.inputSpec.unit&&q.type==='NUMBER'?' '+q.inputSpec.unit:'');
}
function nextSymptom(){sim.qi++;if(sim.qi>=sim.queue.length){sim.done=true;sim.cur=null;sim.ctx=null;sim.endReason='COMPLETED';return;}sim.ctx=sim.queue[sim.qi];sim.cur=S[sim.ctx].entryQuestionId;}
function moveTo(t){
  if(t.type==='QUESTION'){sim.cur=t.questionId;return;}
  if(t.type==='START_SYMPTOM_PATHS'||t.type==='END_SYMPTOM_PATH'){nextSymptom();return;}
  sim.done=true;sim.cur=null;sim.endReason=t.reason||'END';
}
function settle(){
  var g=0;
  while(!sim.done&&sim.cur&&g++<300){
    var q=Q[sim.cur];
    if(q.isShared&&sim.answers[q.id]!==undefined){
      var r=resolveNext(q.id,stt());
      sim.path.push({qid:q.id,auto:true,answerText:answerText(q,sim.answers[q.id]),rule:r?r.id:null,to:targetText(r?r.target:null)});
      if(!r){sim.done=true;sim.cur=null;sim.endReason='NO_RULE_MATCHED';break;}
      moveTo(r.target);
    } else break;
  }
  checkEmergency();
}
function checkEmergency(){EM.forEach(function(e){if(sim.alerts.indexOf(e.id)<0&&evalCond(e.condition,stt()))sim.alerts.push(e.id);});}
function simStart(list,skip){
  if(!list.length){toast('Select at least one symptom on the Home page, or open a symptom tree first.');return;}
  sim={active:true,done:false,queue:list,qi:-1,ctx:null,answers:{},cur:null,path:[],alerts:[],hist:[],endReason:null,skipCommon:!!skip};
  if(sim.skipCommon)nextSymptom();else sim.cur='CQ_01';
  settle();setTab('sim');simSync();
}
function snapshot(){return JSON.stringify({done:sim.done,qi:sim.qi,ctx:sim.ctx,answers:sim.answers,cur:sim.cur,path:sim.path,alerts:sim.alerts,endReason:sim.endReason});}
function simBack(){if(!sim.hist.length)return;var s=JSON.parse(sim.hist.pop());Object.keys(s).forEach(function(k){sim[k]=s[k];});simSync();}
function simSubmit(skip){
  var q=Q[sim.cur],a;
  if(!skip){
    if(q.type==='SINGLE_CHOICE'||q.type==='MULTIPLE_CHOICE'){var v=$$('#psim input[name="a"]:checked').map(function(i){return i.value;});if(!v.length){toast('Please choose an answer.');return;}a={options:v};}
    else if(q.type==='NUMBER'){var n=$('#simnum').value;if(n===''||isNaN(+n)){toast('Enter a number.');return;}if(+n<q.inputSpec.min||+n>q.inputSpec.max){toast('Value must be between '+q.inputSpec.min+' and '+q.inputSpec.max+'.');return;}a={value:+n};}
    else if(q.type==='DURATION'){var d=$('#simnum').value;if(d===''||isNaN(+d)||+d<0){toast('Enter a duration value.');return;}a={value:+d,unit:$('#simunit').value};}
    else a={value:+$('#simscale').value};
  }
  sim.hist.push(snapshot());
  if(a)sim.answers[q.id]=a;
  var r=resolveNext(q.id,stt());
  checkEmergency();
  sim.path.push({qid:q.id,auto:false,answerText:answerText(q,a),rule:r?r.id:null,to:targetText(r?r.target:null)});
  if(!r){sim.done=true;sim.cur=null;sim.endReason='NO_RULE_MATCHED';}else moveTo(r.target);
  settle();simSync();
}
function simSync(){
  renderSim();
  var want=null;
  if(sim.cur){var q=Q[sim.cur];want=q.scope==='COMMON'?'#/common':(sim.ctx?'#/symptom/'+sim.ctx:null);}
  else if(sim.path.length){var lq=Q[sim.path[sim.path.length-1].qid];want=lq.scope==='COMMON'?'#/common':(sim.ctx?'#/symptom/'+sim.ctx:null);}
  if(want&&location.hash!==want){location.hash=want;}else highlightSim();
}
function renderSim(){
  var h='';
  if(!sim.active){
    var l=selList();
    h+='<p>Run the questionnaire engine on the data: answers are evaluated with the same rules the Backend will use. The tree highlights the path taken.</p><p><label><input type="checkbox" id="skipc"> skip common questions</label></p>'+
    '<p>'+(l.length?'Selected symptoms: '+l.map(function(i){return chipBi(S[i].textEn,S[i].textAr,'sym');}).join(' '):'<span class="muted">No symptoms ticked on Home.'+(view.type==='symptom'?' The open symptom will be used.':'')+'</span>')+'</p>'+
    '<button class="btn" data-act="simgo">▶ Start simulation</button>';
    psim.innerHTML=h;return;
  }
  h+='<div class="sec-h"><b>Simulation</b><span><button class="btn sm alt" data-act="simback"'+(sim.hist.length?'':' disabled')+'>◀ Back</button> <button class="btn sm alt" data-act="simreset">Reset</button></span></div>';
  h+='<div class="muted" style="font-size:12px">Symptoms: '+sim.queue.map(function(i,ix){return '<span class="chip sym" style="'+(ix===sim.qi?'outline:2px solid #f59e0b':'')+'">'+esc(S[i].textEn)+'</span>';}).join(' ')+'</div>';
  if(sim.alerts.length){h+='<div class="alert"><b>⚠ Proposed emergency rules triggered</b> (unreviewed)<br>'+sim.alerts.map(function(id){var e=EM.filter(function(x){return x.id===id;})[0];return '<div style="margin-top:4px"><b>'+e.id+'</b> '+esc(e.titleEn)+'</div>';}).join('')+'<div style="margin-top:6px">'+bi(DATA.medicalSafety.emergencyRules.rules[0].messageEn,DATA.medicalSafety.emergencyRules.rules[0].messageAr)+'</div></div>';}
  if(sim.done){
    h+='<div class="simq"><span class="endnode'+(sim.endReason==='COMPLETED'?'':' stop')+'">■ '+(sim.endReason==='COMPLETED'?'Questionnaire complete':'Questionnaire ended: '+esc(sim.endReason))+'</span></div>';
  } else if(sim.cur){
    var q=Q[sim.cur];
    h+='<div class="simq"><div class="qhead"><span class="qid">'+q.id+'</span><span class="badge type">'+q.type+'</span><span class="badge '+qclass(q)+'">'+q.scope+'</span><span class="badge req">'+(q.required?'required':'optional')+'</span></div><div style="margin:4px 0 8px">'+bi(q.textEn,q.textAr)+'</div>';
    if(q.type==='SINGLE_CHOICE'||q.type==='MULTIPLE_CHOICE'){
      (OPTS[q.id]||[]).forEach(function(o){h+='<label class="simopt"><input type="'+(q.type==='SINGLE_CHOICE'?'radio':'checkbox')+'" name="a" value="'+o.id+'" data-ex="'+(o.exclusive?1:0)+'"><span>'+bi(o.textEn,o.textAr)+'</span></label>';});
    } else if(q.type==='NUMBER'){h+='<input type="number" id="simnum" min="'+q.inputSpec.min+'" max="'+q.inputSpec.max+'" step="any" style="padding:6px;width:140px"> '+esc(q.inputSpec.unit||'');}
    else if(q.type==='DURATION'){h+='<input type="number" id="simnum" min="0" step="any" style="padding:6px;width:100px"> <select id="simunit" style="padding:6px">'+q.inputSpec.units.map(function(u){return '<option>'+u+'</option>';}).join('')+'</select>';}
    else {h+='<input type="range" id="simscale" min="'+q.inputSpec.min+'" max="'+q.inputSpec.max+'" step="'+q.inputSpec.step+'" value="'+q.inputSpec.min+'" oninput="document.getElementById(\'simsv\').textContent=this.value"> <b id="simsv">'+q.inputSpec.min+'</b>';}
    h+='<div style="margin-top:10px"><button class="btn" data-act="simsubmit">Submit answer ➜</button> '+(q.required?'':'<button class="btn alt" data-act="simskip">Skip</button>')+'</div></div>';
  }
  h+='<div class="path"><b>Full path so far ('+sim.path.length+')</b><ol>'+sim.path.map(function(p){return '<li>'+qref(p.qid)+' — '+esc(p.answerText)+(p.auto?' <span class="chip">auto: already answered</span>':'')+'<br><span class="muted">'+(p.rule?'<a class="prio" data-rule="'+p.rule+'">'+p.rule+'</a> ➜ ':'')+esc(p.to)+'</span></li>';}).join('')+'</ol></div>';
  psim.innerHTML=h;
}
function highlightSim(){
  $$('.qcard.on-path,.qcard.current,.branch.fired',main).forEach(function(e){e.classList.remove('on-path','current','fired');});
  if(!sim.active)return;
  sim.path.forEach(function(p){$$('.qcard[data-q="'+p.qid+'"]',main).forEach(function(c){c.classList.add('on-path');});if(p.rule)$$('.branch[data-rule="'+p.rule+'"]',main).forEach(function(b){b.classList.add('fired');});});
  if(sim.cur){var c=$('.qcard[data-q="'+sim.cur+'"]',main);if(c){var p=c.parentElement;while(p){if(p.classList&&p.classList.contains('node'))p.classList.remove('collapsed');p=p.parentElement;}c.classList.add('current');c.scrollIntoView({block:'center',behavior:'smooth'});}}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var it=t.closest('#results .it');if(it){resBox.style.display='none';if(it.dataset.go)go(it.dataset.go);else openQuestion(it.dataset.q);return;}
  var tab=t.closest('.tabs button');if(tab){setTab(tab.dataset.tab);return;}
  var lb=t.closest('#langsw button');if(lb){document.body.classList.remove('lang-en','lang-ar','lang-both');document.body.classList.add('lang-'+lb.dataset.l);$$('#langsw button').forEach(function(b){b.classList.toggle('on',b===lb);});return;}
  var pr=t.closest('.prio[data-rule]');if(pr){showRule(pr.dataset.rule);return;}
  var rf=t.closest('.qref,.ref');if(rf){openQuestion(rf.dataset.q);return;}
  var tg=t.closest('.tog');if(tg){tg.closest('.node').classList.toggle('collapsed');return;}
  var ac=t.closest('[data-act]');
  if(ac){var a=ac.dataset.act;
    if(a==='expand')$$('.node',main).forEach(function(n){n.classList.remove('collapsed');});
    else if(a==='collapse')$$('.node',main).forEach(function(n){n.classList.add('collapsed');});
    else if(a==='level1')$$('.node',main).forEach(function(n,i){n.classList.toggle('collapsed',i>0&&!!n.parentElement.closest('.node'));});
    else if(a==='simsel')simStart(selList(),false);
    else if(a==='clearsel'){sel={};renderMain();}
    else if(a==='simview'){simStart(view.type==='symptom'?[view.id]:(selList().length?selList():[DATA.symptoms[0].id]),false);}
    else if(a==='simgo'){var l=selList();if(!l.length&&view.type==='symptom')l=[view.id];simStart(l,$('#skipc')&&$('#skipc').checked);}
    else if(a==='simsubmit')simSubmit(false);
    else if(a==='simskip')simSubmit(true);
    else if(a==='simback')simBack();
    else if(a==='simreset'){sim.active=false;sim.cur=null;sim.path=[];renderSim();highlightSim();}
    return;}
  var qc=t.closest('.qcard');if(qc){showDetail(qc.dataset.q);return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.sel){sel[t.dataset.sel]=t.checked;updateSelBar();return;}
  if(t.id==='chk-shared'){document.body.classList.toggle('hl-shared',t.checked);return;}
  if(t.id==='chk-opts'){document.body.classList.toggle('no-opts',!t.checked);return;}
  if(t.name==='a'&&t.type==='checkbox'){
    if(t.checked){var ex=t.dataset.ex==='1';$$('#psim input[name="a"]').forEach(function(i){if(i!==t&&(ex||i.dataset.ex==='1'))i.checked=false;});}
  }
});
setTab('detail');
route();
})();
</script>
